<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vehículo · CarDocs</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body data-page="vehicle">
  <header class="top">
    <a class="brand" href="/garage">Car<span>Docs</span></a>
    <div class="who"><span id="who"></span><button id="logout" class="secondary small" type="button">Cerrar sesión</button></div>
  </header>
  <main>
    <p><a href="/garage">← Volver al garage</a></p>
    <div class="toolbar">
      <div>
        <h1 id="car-title" style="margin:0"></h1>
        <div id="car-plates" class="muted"></div>
      </div>
    </div>
    <div id="error" class="error" role="alert"></div>

    <section class="card">
      <div class="toolbar">
        <h2 style="margin:0">Documentos</h2>
        <label style="margin:0">Tipo
          <select id="filter-type">
            <option value="">Todos</option>
            <option value="factura">Factura</option>
            <option value="poliza">Póliza</option>
            <option value="verificacion">Verificación</option>
            <option value="foto">Foto</option>
            <option value="otro">Otro</option>
          </select>
        </label>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Tipo</th><th>Archivo</th><th>Emisión</th><th>Vencimiento</th><th>Estado</th><th></th></tr></thead>
          <tbody id="docs-body"></tbody>
        </table>
      </div>
    </section>

    <section class="card owner-only">
      <h2>Subir documento</h2>
      <form id="upload-form">
        <div class="row">
          <label>Archivo (pdf, jpg, png · máx. 10 MB) <input name="file" type="file" accept=".pdf,.jpg,.jpeg,.png" required></label>
          <label>Tipo
            <select name="doc_type" required>
              <option value="factura">Factura</option>
              <option value="poliza">Póliza</option>
              <option value="verificacion">Verificación</option>
              <option value="foto">Foto</option>
              <option value="otro">Otro</option>
            </select>
          </label>
          <label>Emisión <input name="issued_on" type="date"></label>
          <label>Vencimiento <input name="expires_on" type="date"></label>
        </div>
        <button type="submit">Subir</button>
      </form>
    </section>

    <section class="card owner-only">
      <h2>Talleres autorizados</h2>
      <ul id="shares" class="plain"></ul>
      <form id="share-form" class="row">
        <label>Email del taller <input name="email" type="text" inputmode="email" required></label>
        <button type="submit" style="margin-bottom:0.75rem">Autorizar</button>
      </form>
    </section>

    <section class="card owner-only">
      <h2>Datos del auto</h2>
      <form id="edit-form">
        <div class="row">
          <label>Placas <input name="plates" required maxlength="15"></label>
          <label>Marca <input name="brand" required maxlength="60"></label>
          <label>Modelo <input name="model" required maxlength="60"></label>
          <label>Año <input name="year" type="number" required min="1980" max="2100"></label>
        </div>
        <button type="submit">Guardar cambios</button>
        <button type="button" id="delete-car" class="danger">Eliminar auto</button>
      </form>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
